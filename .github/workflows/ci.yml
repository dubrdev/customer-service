name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest      # Docker is available, so Testcontainers works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Unit + integration tests
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
      - name: Build image
        run: docker build -t customer-service:${{ github.sha }} .
      # Next stages (not enabled): image scan (Trivy), push to registry, deploy with kubectl/Helm/Argo CD,
      # smoke test + k6 thresholds as a quality gate.

# kubectl apply -f k8s/customer-service.yaml   (namespace, Postgres, RabbitMQ, Redis and Keycloak are assumed to exist)
apiVersion: v1
kind: ConfigMap
metadata: { name: customer-service-config }
data:
  DB_URL: jdbc:postgresql://postgres:5432/customers
  RABBIT_HOST: rabbitmq
  REDIS_HOST: redis
  SCORE_BASE_URL: http://score-service:8080
  JWT_JWK_SET_URI: http://keycloak:8080/realms/customers/protocol/openid-connect/certs
---
apiVersion: v1
kind: Secret
metadata: { name: customer-service-secret }
type: Opaque
stringData:               # demo values - use External Secrets / Vault / Sealed Secrets in real clusters
  DB_USER: customers
  DB_PASSWORD: customers
  RABBIT_USER: guest
  RABBIT_PASSWORD: guest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  labels: { app: customer-service }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: customer-service } }
  template:
    metadata:
      labels: { app: customer-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        # Dynatrace: with the Dynatrace Operator, OneAgent is injected automatically into labelled namespaces
        # (metadata.dynatrace.com/inject: "true"). Alternatively set DT_METRICS_ENABLED=true for Micrometer export.
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: customer-service:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: customer-service-config }
            - secretRef: { name: customer-service-secret }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          lifecycle:
            preStop: { exec: { command: ["sh", "-c", "sleep 5"] } }   # let the Service drain endpoints before SIGTERM
---
apiVersion: v1
kind: Service
metadata: { name: customer-service }
spec:
  selector: { app: customer-service }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: customer-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: customer-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: customer-service }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: customer-service } }
